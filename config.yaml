# Every setting lives here. Paths are relative to the repo root.
schema_file: schema.json
data_dir: data
reports_dir: reports
base_model: microsoft/Phi-4-mini-instruct   # MIT. Fallbacks, in order: Qwen/Qwen3-4B, HuggingFaceTB/SmolLM3-3B
seed: 0

# Synthetic advert generator and data checker (step 3).
generator:
  seeds: {train: 1, dev: 2, test: 3}
  sizes: {train: 2000, dev: 300, test: 600}
  max_text_chars: 3500
  class_mix: {offers: 0.30, excludes: 0.25, not_stated: 0.30, unclear: 0.15}
  class_tolerance_points: 5

# Inference and the evaluation arms (step 8). Every arm reads these, so no arm gets a longer or shorter answer.
inference:
  max_new_tokens: 300
  batch_size: 1
  ollama_url: http://localhost:11434
  ollama_model: phi4-mini:3.8b
  hf_cache: "set HF_HOME in the shell (for example D:/ml_cache/huggingface); nothing is set in code"

# QLoRA training (step 9). The allowed values are the pre-registered grid of eval/protocol.md section 6 (F2).
training:
  allowed: {rank: [8, 16], learning_rate: [0.0001, 0.0002], epochs: [1, 2, 3]}
  max_dev_runs: 5            # the equal tuning budget: at most this many LoRA training runs on dev
  alpha_factor: 2            # lora_alpha = alpha_factor x rank
  dropout: 0.05
  target_modules: [qkv_proj, o_proj, gate_up_proj, down_proj]   # Phi-4-mini fused attention and MLP layers
  batch_size: 1
  accumulation: 16
  max_length: 1024           # the longest training example is 577 tokens
  scheduler: cosine
  warmup: 0.05               # a float below 1 is a share of all training steps (transformers 5)
  adapter_dir: outputs/adapters   # outside git (see .gitignore)
